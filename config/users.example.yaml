# User credential template file
#
# Usage:
#   1. Copy this file to users.yaml in the same directory
#   2. Generate a password hash with the command below and replace the password field
#        python -c "from config.security import hash_password; print(hash_password('your-password'))"
#   3. users.yaml is excluded by .gitignore; never commit it
#
# The password field supports two forms:
#   - pbkdf2_sha256$<iterations>$<salt_base64>$<hash_base64>  — recommended, verified as a hash on load
#   - plaintext string  — legacy compatibility only; auto-upgraded to a hash after the first successful login
#
# role values: admin | user

users:
  admin:
    password: "pbkdf2_sha256$260000$REPLACE_WITH_SALT$REPLACE_WITH_HASH"
    role: admin
  user1:
    password: "pbkdf2_sha256$260000$REPLACE_WITH_SALT$REPLACE_WITH_HASH"
    role: user
