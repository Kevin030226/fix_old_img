# Alembic configuration (plan Sec.4.3 Step 2).
#
# The database URL is NOT set here: migrations/env.py resolves it from
# FIXIMG_DATABASE_URL (via fiximg.infrastructure.db.engine) so there is one
# source of truth for where the database lives.
#
#   alembic upgrade head        apply every pending revision
#   alembic downgrade -1        roll one back
#   alembic current             what is applied
#   alembic history --verbose   the full chain
#
# Programmatic use (no shell): fiximg.infrastructure.db.migrations.alembic_runner

[alembic]
script_location = migrations
prepend_sys_path = src
# 0001_v3_baseline, 0002_v3_columns, ... -- revision first so the directory sorts.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
path_separator = os
# No autogenerate: the schema is written by hand because the repositories use
# SQLite-specific DDL that autogenerate cannot reproduce faithfully.
# (target_metadata is None in env.py for the same reason.)
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
